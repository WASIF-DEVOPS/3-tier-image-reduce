name: 🚀 Three-Tier CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: three-tier-cluster
  ECR_FRONTEND_REPO: three-tier-frontend
  ECR_BACKEND_REPO: three-tier-backend

jobs:
  # =============================================
  # JOB 1: Build & Push Docker Images to ECR
  # =============================================
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest

    outputs:
      image-tag: ${{ github.sha }}
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Frontend
      - name: 🏗️ Build Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building frontend image..."
          docker build \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest \
            ./Docker-Compose-Projects/frontend/
          echo "✅ Frontend build done"

      # Build Backend
      - name: 🏗️ Build Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building backend image..."
          docker build \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest \
            ./Docker-Compose-Projects/backend/
          echo "✅ Backend build done"

      # Push Both Images
      - name: 📤 Push Frontend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest
          echo "✅ Frontend pushed to ECR"

      - name: 📤 Push Backend to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest
          echo "✅ Backend pushed to ECR"

  # =============================================
  # JOB 2: Deploy to EKS (runs after build)
  # =============================================
  deploy-to-eks:
    name: ☸️ Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push     # Build pehle complete ho

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ⚙️ Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: 🔗 Connect to EKS Cluster
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          kubectl get nodes

      - name: 🏷️ Update Image Tags in K8s Manifests
        env:
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr-registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Frontend image update
          sed -i "s|nahid0002/three-tier-frontend:v1|$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG|g" \
            k8s-manifest/frontend/frontend-deployment.yaml

          # Backend image update
          sed -i "s|nahid0002/three-tier-backend:v1|$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG|g" \
            k8s-manifest/backend/backend-deployment.yaml

          echo "✅ Image tags updated"

      - name: 🗄️ Deploy Database Layer
        run: |
          kubectl apply -f k8s-manifest/database/ -n three-tier
          echo "✅ Database deployed"

      - name: ⚙️ Deploy Backend
        run: |
          kubectl apply -f k8s-manifest/backend/ -n three-tier
          kubectl rollout status deployment/backend -n three-tier --timeout=180s
          echo "✅ Backend deployed"

      - name: 🌐 Deploy Frontend
        run: |
          kubectl apply -f k8s-manifest/frontend/ -n three-tier
          kubectl rollout status deployment/frontend -n three-tier --timeout=180s
          echo "✅ Frontend deployed"

      - name: 📊 Deployment Summary
        run: |
          echo ""
          echo "=========================================="
          echo "  🎉 DEPLOYMENT SUCCESSFUL!"
          echo "=========================================="
          echo ""
          echo "📦 PODS:"
          kubectl get pods -n three-tier
          echo ""
          echo "🌐 SERVICES:"
          kubectl get services -n three-tier
          echo ""
          echo "📅 Commit: ${{ github.sha }}"
          echo "👤 Triggered by: ${{ github.actor }}"
