apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nahid0002/three-tier-frontend:v1
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_API_BASE_URL
              value: "http://aa4ff9dd8dbcc4a26994fa8f0ccc8599-1181672981.us-east-1.elb.amazonaws.com:3500"
